# Manually run the Jobber sync. GitHub → Actions → Sync → Run workflow.
# Output is counts and field names only, never customer data.
name: Sync

on:
  workflow_dispatch:
    inputs:
      step:
        description: "What to run"
        type: choice
        default: check
        options:
          - status           # last sync time, recent errors, record totals (no customer details)
          - check            # compare our queries to Jobber's schema; reads schema only, saves nothing
          - backfill-all     # import full history, one record type at a time
          - finish           # confirm the history import is complete and switch on the 15-minute sync
          - incremental      # pull what changed since the last sync

permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE: https://fmpbjesfoeupybflfrbd.supabase.co/functions/v1/jobber-sync
      SYNC_KEY: ${{ secrets.SYNC_KEY }}
    steps:
      - name: Run
        run: |
          set -euo pipefail
          call() {
            echo "::group::$1"
            code=$(curl -sS -o out.json -w "%{http_code}" -X POST -H "x-sync-key: $SYNC_KEY" "$BASE?$1" --max-time 400)
            cat out.json; echo; echo "::endgroup::"
            if [ "$code" != "200" ] || grep -q '"ok": false' out.json; then
              echo "::error::$1 failed (HTTP $code)"; exit 1
            fi
          }
          case "${{ inputs.step }}" in
            status)      call "mode=status" ;;
            check)       call "mode=check" ;;
            incremental)
              for i in $(seq 1 10); do
                call "mode=incremental&force=1"
                grep -q '"done": true' out.json && break
                if [ "$i" = 10 ]; then echo "::error::sync cycle did not finish in 10 calls"; exit 1; fi
              done ;;
            backfill-all)
              # Each call imports until it finishes or nears the time limit, then saves its place.
              for t in users clients requests quotes jobs invoices timesheets; do
                for i in $(seq 1 40); do
                  call "mode=backfill&only=$t"
                  grep -q '"done": true' out.json && break
                  if [ "$i" = 40 ]; then echo "::error::$t did not finish in 40 rounds"; exit 1; fi
                done
              done ;;
            finish)      call "mode=backfill&only=done" ;;
          esac
