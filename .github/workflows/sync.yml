# Manually run the Jobber, Quo or Meta sync. GitHub → Actions → Sync → Run workflow.
# Output is counts and field names only, never customer data.
name: Sync

on:
  workflow_dispatch:
    inputs:
      step:
        description: "What to run"
        type: choice
        default: check
        options:
          - status           # last sync time, recent errors, record totals (no customer details)
          - check            # compare our queries to Jobber's schema; reads schema only, saves nothing
          - backfill-all     # import full history, one record type at a time
          - finish           # confirm the history import is complete and switch on the 15-minute sync
          - incremental      # pull what changed since the last sync
          - refresh-jobs     # re-read every job from Jobber (e.g. after editing old jobs' crews); read-only
          - refresh-upsell-offers  # re-read the "Upsell offer" field on every job; read-only
          - quo-check        # confirm the Quo key works; reads one page of each list, saves nothing
          - quo-backfill     # import the last 2 years of Quo calls and texts (read-only); turns on the 5-minute Quo sync
          - quo-status       # Quo sync time and record counts (no customer details)
          - quo-incremental  # pull new Quo calls and texts now
          - meta-check       # confirm the Meta token and ad account; reads, saves nothing
          - meta-backfill    # import ad results for the last ~2 years (read-only); turns on the hourly Meta sync
          - meta-status      # Meta sync time, date range and totals

permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE: https://fmpbjesfoeupybflfrbd.supabase.co/functions/v1/jobber-sync
      QUO: https://fmpbjesfoeupybflfrbd.supabase.co/functions/v1/quo-sync
      META: https://fmpbjesfoeupybflfrbd.supabase.co/functions/v1/meta-sync
      SYNC_KEY: ${{ secrets.SYNC_KEY }}
    steps:
      - name: Run
        run: |
          set -euo pipefail
          call() {
            echo "::group::$1"
            url="$BASE?$1"; case "$1" in quo:*) url="$QUO?${1#quo:}" ;; meta:*) url="$META?${1#meta:}" ;; esac
            code=$(curl -sS -o out.json -w "%{http_code}" -X POST -H "x-sync-key: $SYNC_KEY" "$url" --max-time 400)
            cat out.json; echo; echo "::endgroup::"
            if [ "$code" != "200" ] || grep -q '"ok": false' out.json; then
              echo "::error::$1 failed (HTTP $code)"; exit 1
            fi
          }
          case "${{ inputs.step }}" in
            status)      call "mode=status" ;;
            check)       call "mode=check" ;;
            incremental)
              for i in $(seq 1 10); do
                call "mode=incremental&force=1"
                grep -q '"done": true' out.json && break
                if [ "$i" = 10 ]; then echo "::error::sync cycle did not finish in 10 calls"; exit 1; fi
              done ;;
            backfill-all)
              # Each call imports until it finishes or nears the time limit, then saves its place.
              for t in users clients requests quotes jobs invoices timesheets; do
                for i in $(seq 1 40); do
                  call "mode=backfill&only=$t"
                  grep -q '"done": true' out.json && break
                  if [ "$i" = 40 ]; then echo "::error::$t did not finish in 40 rounds"; exit 1; fi
                done
              done ;;
            finish)      call "mode=backfill&only=done" ;;
            refresh-jobs)
              # Start over once, then keep going from the saved place until every job is re-read.
              call "mode=backfill&only=jobs&restart=1"
              for i in $(seq 1 40); do
                grep -q '"done": true' out.json && break
                call "mode=backfill&only=jobs"
                if [ "$i" = 40 ]; then echo "::error::job refresh did not finish in 40 rounds"; exit 1; fi
              done ;;
            refresh-upsell-offers) call "mode=backfill&only=jobfields" ;;
            quo-check)       call "quo:mode=check" ;;
            quo-status)      call "quo:mode=status" ;;
            quo-incremental) call "quo:mode=incremental&force=1" ;;
            meta-check)      call "meta:mode=check" ;;
            meta-status)     call "meta:mode=status" ;;
            meta-backfill)
              for i in $(seq 1 30); do
                call "meta:mode=backfill"
                grep -q '"done": true' out.json && break
                if [ "$i" = 30 ]; then echo "::error::Meta import did not finish in 30 rounds"; exit 1; fi
              done ;;
            quo-backfill)
              for i in $(seq 1 60); do
                call "quo:mode=backfill"
                grep -q '"done": true' out.json && break
                if [ "$i" = 60 ]; then echo "::error::Quo import did not finish in 60 rounds"; exit 1; fi
              done ;;
          esac
