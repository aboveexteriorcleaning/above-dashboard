# Deploy to Supabase. Runs ONLY when someone clicks "Run workflow" in
# GitHub → Actions → Deploy. Every test runs first; if any fails, nothing deploys.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to do"
        type: choice
        default: preview
        options:
          - preview          # run tests + show what would change; deploys nothing
          - everything       # database changes + sync functions
          - database-only
          - functions-only

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT_ID: fmpbjesfoeupybflfrbd
  FUNCTIONS: jobber-connect jobber-oauth-callback jobber-sync jobber-webhook quo-sync meta-sync google-connect google-oauth-callback google-sync leads-sheet-sync

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: test
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Access-rule tests (crew can't see each other, nobody can write Jobber data)
        run: |
          psql -v ON_ERROR_STOP=1 -c "create database testdb"
          for f in supabase/tests/supabase_stub.sql \
                   supabase/migrations/20261024000001_core_schema.sql \
                   supabase/migrations/20261024000002_access_rules.sql \
                   supabase/migrations/20261024000003_sync_support.sql \
                   supabase/migrations/20261024000006_dashboard_metrics.sql \
                   supabase/migrations/20261024000007_even_split_credit.sql \
                   supabase/migrations/20261024000008_job_list_hours.sql \
                   supabase/migrations/20261024000009_commission.sql \
                   supabase/migrations/20261024000010_quotes_cut_and_dry.sql \
                   supabase/migrations/20261024000011_plan_counting.sql \
                   supabase/migrations/20261024000012_plans_tab.sql \
                   supabase/migrations/20261024000013_plan_conversion.sql \
                   supabase/migrations/20261024000014_plan_sales_credit.sql \
                   supabase/migrations/20261024000015_plan_credit_full.sql \
                   supabase/migrations/20261024000016_returning_split.sql \
                   supabase/migrations/20261025000017_quo.sql \
                   supabase/migrations/20261025000018_business_hours.sql \
                   supabase/migrations/20261025000019_stored_rollups.sql \
                   supabase/migrations/20261025000020_leads_from_jobber.sql \
                   supabase/migrations/20261025000021_reply_clock.sql \
                   supabase/migrations/20261025000022_follow_up_rule.sql \
                   supabase/migrations/20261025000023_follow_ups.sql \
                   supabase/migrations/20261025000024_quote_speed.sql \
                   supabase/migrations/20261025000025_meta_ads.sql \
                   supabase/migrations/20261025000026_growth.sql \
                   supabase/migrations/20261025000027_operations.sql \
                   supabase/migrations/20261025000028_revenue.sql \
                   supabase/migrations/20261025000029_financial.sql \
                   supabase/migrations/20261025000030_google_reviews.sql \
                   supabase/migrations/20261025000031_places_reviews.sql \
                   supabase/migrations/20261025000032_reach_attempts.sql \
                   supabase/migrations/20261025000033_open_quotes.sql \
                   supabase/migrations/20261025000034_capacity_calendar.sql \
                   supabase/migrations/20261026000035_view_as.sql \
                   supabase/migrations/20261026000036_upsell_rate.sql \
                   supabase/migrations/20261026000037_earnings.sql \
                   supabase/migrations/20261027000038_converted_counts_as_approved.sql \
                   supabase/migrations/20261028000039_meta_lead_sheet.sql \
                   supabase/tests/access_rules_test.sql; do
            psql -v ON_ERROR_STOP=1 -q -d testdb -f "$f"
          done

      - name: Type-check sync functions
        working-directory: supabase/functions
        run: deno check jobber-*/index.ts quo-sync/index.ts meta-sync/index.ts google-*/index.ts

      - name: Sync tests (read-only guard, mapping, database integration)
        working-directory: supabase/functions
        run: |
          psql -v ON_ERROR_STOP=1 -c "create database synctest"
          for f in ../tests/supabase_stub.sql \
                   ../migrations/20261024000001_core_schema.sql \
                   ../migrations/20261024000002_access_rules.sql \
                   ../migrations/20261024000003_sync_support.sql \
                   ../migrations/20261024000006_dashboard_metrics.sql \
                   ../migrations/20261024000007_even_split_credit.sql \
                   ../migrations/20261024000008_job_list_hours.sql \
                   ../migrations/20261024000009_commission.sql \
                   ../migrations/20261024000010_quotes_cut_and_dry.sql \
                   ../migrations/20261024000011_plan_counting.sql \
                   ../migrations/20261024000012_plans_tab.sql \
                   ../migrations/20261024000013_plan_conversion.sql \
                   ../migrations/20261024000014_plan_sales_credit.sql \
                   ../migrations/20261024000015_plan_credit_full.sql \
                   ../migrations/20261024000016_returning_split.sql \
                   ../migrations/20261025000017_quo.sql \
                   ../migrations/20261025000018_business_hours.sql \
                   ../migrations/20261025000019_stored_rollups.sql \
                   ../migrations/20261025000020_leads_from_jobber.sql \
                   ../migrations/20261025000021_reply_clock.sql \
                   ../migrations/20261025000022_follow_up_rule.sql \
                   ../migrations/20261025000023_follow_ups.sql \
                   ../migrations/20261025000024_quote_speed.sql \
                   ../migrations/20261025000025_meta_ads.sql \
                   ../migrations/20261025000026_growth.sql \
                   ../migrations/20261025000027_operations.sql \
                   ../migrations/20261025000028_revenue.sql \
                   ../migrations/20261025000029_financial.sql \
                   ../migrations/20261025000030_google_reviews.sql \
                   ../migrations/20261025000031_places_reviews.sql \
                   ../migrations/20261025000032_reach_attempts.sql \
                   ../migrations/20261025000033_open_quotes.sql \
                   ../migrations/20261025000034_capacity_calendar.sql \
                   ../migrations/20261026000035_view_as.sql \
                   ../migrations/20261026000036_upsell_rate.sql \
                   ../migrations/20261026000037_earnings.sql \
                   ../migrations/20261027000038_converted_counts_as_approved.sql \
                   ../migrations/20261028000039_meta_lead_sheet.sql; do
            psql -v ON_ERROR_STOP=1 -q -d synctest -f "$f"
          done
          SUPABASE_DB_URL=postgres://postgres:test@localhost:5432/synctest deno test -A tests/

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Unit tests (Pacific-time periods)
        run: npm test
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build (sample-data mode, no real keys)
        run: npx next build
        env:
          DEMO_MODE: "1"
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only

  deploy:
    needs: [test, web]
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_ID"

      - name: Preview database changes
        run: supabase db push --linked --dry-run

      - name: Apply database changes
        if: inputs.target == 'everything' || inputs.target == 'database-only'
        run: supabase db push --linked

      - name: Deploy sync functions
        if: inputs.target == 'everything' || inputs.target == 'functions-only'
        run: |
          for fn in $FUNCTIONS; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_ID"
          done
